name: publish-npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # OIDC：Trusted Publishing 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 不要给 setup-node 传 registry-url：它会写带占位 token 的 .npmrc，顶掉 OIDC。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use npm CLI with trusted publishing support
        run: npm install -g npm@latest
      - name: Diagnose OIDC availability
        run: |
          echo "npm: $(npm --version)"
          echo "registry: $(npm config get registry)"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo ID_TOKEN_URL_SET=yes; else echo ID_TOKEN_URL_SET=no; fi
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then echo ID_TOKEN_REQ_SET=yes; else echo ID_TOKEN_REQ_SET=no; fi
      - name: Publish to npm (trusted publishing, no token/OTP)
        run: npm publish --access public
