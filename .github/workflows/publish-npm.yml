name: publish-npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # OIDC：Trusted Publishing 必需（无需 token/OTP）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 不要给 setup-node 传 registry-url：它会写带占位 token 的 .npmrc，顶掉 OIDC。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@latest
      - run: npm publish --access public